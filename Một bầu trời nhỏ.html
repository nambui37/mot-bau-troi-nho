<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Một bầu trời nhỏ</title>
  <meta name="theme-color" content="#070b1a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Caveat:wght@500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --night: #070b1a;
      --night2: #111a44;
      --cream: #f6efe2;
      --mute: #b4aec6;
      --accent: #ffc9a8;
      --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --hand: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: dark;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --night: #070b1a
      }
    }

    :root[data-theme="dark"] {
      --night: #070b1a
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: radial-gradient(120% 100% at 50% 115%, #1d2556 0%, #0d1335 42%, #050816 100%);
      color: var(--cream);
      font-family: var(--serif);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .5) 100%)
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    #sky.pick {
      cursor: pointer
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 6px
    }

    [hidden] {
      display: none !important
    }

    /* ===== mở đầu: một ngôi sao ===== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      padding: 24px;
      transition: opacity 1.6s ease
    }

    #intro.gone {
      opacity: 0;
      pointer-events: none
    }

    #firstStar {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #firstStar .core {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 18px 6px rgba(255, 235, 210, .75), 0 0 60px 18px rgba(255, 201, 168, .35);
      animation: tw 3.2s ease-in-out infinite
    }

    #firstStar .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 225, 200, .5);
      animation: ping 3.2s ease-out infinite
    }

    #firstStar .ring.r2 {
      animation-delay: 1.6s
    }

    @keyframes tw {
      50% {
        transform: scale(.7);
        opacity: .7
      }
    }

    @keyframes ping {
      0% {
        transform: scale(.25);
        opacity: .9
      }

      100% {
        transform: scale(1.5);
        opacity: 0
      }
    }

    #introHint {
      font-family: var(--hand);
      font-size: clamp(28px, 6vw, 36px);
      margin: 0;
      color: var(--cream);
      opacity: .92;
      text-align: center;
      transition: opacity .8s
    }

    #gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(380px, 100%);
      text-align: center;
      animation: fadeUp 1.2s ease both
    }

    #gate label {
      font-style: italic;
      font-size: clamp(22px, 5vw, 26px);
      line-height: 1.3
    }

    .gin {
      width: 100%;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(246, 239, 226, .5);
      padding-bottom: 6px
    }

    .gin input {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      color: var(--cream);
      font: inherit;
      font-size: 24px;
      text-align: center;
      letter-spacing: .05em
    }

    .gin input:focus {
      outline: none
    }

    .gin button {
      font-family: var(--hand);
      font-size: 26px;
      color: var(--accent)
    }

    #gerr {
      min-height: 26px;
      margin: 0;
      color: var(--accent);
      font-size: 19px;
      font-style: italic
    }

    #gate.shake {
      animation: shake .45s
    }

    @keyframes shake {

      20%,
      60% {
        transform: translateX(-8px)
      }

      40%,
      80% {
        transform: translateX(8px)
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* ===== lời dẫn ===== */
    #line {
      position: fixed;
      left: 0;
      right: 0;
      top: 40%;
      transform: translateY(-50%);
      z-index: 8;
      text-align: center;
      padding: 0 28px;
      pointer-events: none;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(26px, 5.8vw, 42px);
      line-height: 1.3;
      text-wrap: balance;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .7);
      opacity: 0;
      transition: opacity 1.6s ease
    }

    #line.on {
      opacity: 1
    }

    /* ===== HUD ===== */
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(46px + env(safe-area-inset-bottom, 0px));
      z-index: 8;
      text-align: center;
      font-family: var(--hand);
      font-size: clamp(24px, 5vw, 30px);
      color: var(--accent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .8)
    }

    #hint.on {
      opacity: .95;
      animation: breath 3.4s ease-in-out infinite
    }

    @keyframes breath {
      50% {
        opacity: .5
      }
    }

    #dots {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      z-index: 8;
      display: flex;
      justify-content: center;
      gap: 9px;
      opacity: 0;
      transition: opacity 1.2s;
      pointer-events: none
    }

    #dots.on {
      opacity: 1
    }

    #dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(246, 239, 226, .28);
      transition: background .6s, transform .6s
    }

    #dots i.on {
      background: var(--accent);
      transform: scale(1.25)
    }

    #mute {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 30;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(8, 12, 34, .5);
      border: 1px solid rgba(246, 239, 226, .22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px)
    }

    #mute.on {
      display: flex
    }

    #mute svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--cream);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    /* ===== màn hình kỷ niệm ===== */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
      background: rgba(4, 7, 22, .82);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      overflow: auto
    }

    .overlay.open {
      display: flex;
      animation: fadeIn .8s ease both
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .mem {
      width: min(980px, 100%);
      display: grid;
      gap: 22px;
      justify-items: center;
      align-items: center;
      margin: auto
    }

    @media(min-width:820px) and (min-aspect-ratio:1/1) {
      .mem {
        grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
        gap: 56px
      }
    }

    .frame {
      margin: 0;
      padding: 9px;
      background: #f6efe2;
      border-radius: 4px;
      box-shadow: 0 0 70px rgba(255, 201, 168, .22), 0 24px 60px rgba(0, 0, 0, .65);
      animation: fromStar 1.1s cubic-bezier(.2, .85, .25, 1) both
    }

    .frame img,
    .frame video {
      display: block;
      max-width: min(100%, 520px);
      max-height: 56vh;
      width: auto;
      height: auto;
      border-radius: 2px;
      background: #000;
      object-fit: contain;
    }

    @media(min-width:820px) and (min-aspect-ratio:1/1) {

      .frame img,
      .frame video {
        max-height: 72vh
      }
    }

    @keyframes fromStar {
      from {
        opacity: 0;
        transform: translate(var(--ox, 0), var(--oy, 0)) scale(.03) rotate(-6deg);
        filter: blur(6px)
      }

      to {
        opacity: 1;
        transform: none;
        filter: none
      }
    }

    .txt {
      text-align: center;
      max-width: 460px
    }

    @media(min-width:820px) and (min-aspect-ratio:1/1) {
      .txt {
        text-align: left
      }
    }

    .txt>* {
      opacity: 0;
      animation: fadeUp 1s ease both
    }

    .txt .d {
      font-family: var(--hand);
      font-size: 26px;
      color: var(--accent);
      display: block;
      animation-delay: .9s
    }

    .txt h2 {
      font-weight: 600;
      font-style: italic;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.15;
      margin: 2px 0 12px;
      animation-delay: 1.2s
    }

    .txt p {
      text-wrap: balance;
      font-size: clamp(20px, 4.4vw, 24px);
      line-height: 1.5;
      margin: 0 0 8px;
      color: #efe7da;
      animation-delay: 1.6s
    }

    .txt small {
      display: block;
      color: var(--mute);
      font-size: 15px;
      font-style: italic;
      animation-delay: 2s
    }

    .nextb {
      margin-top: 18px;
      font-family: var(--hand);
      font-size: 30px;
      color: var(--accent);
      animation-delay: 2.2s !important;
      padding: 6px 2px;
      border-bottom: 1px solid rgba(255, 201, 168, .5)
    }

    /* ===== thư và câu hỏi ===== */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 26;
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(30px + env(safe-area-inset-top, 0px)) 26px calc(30px + env(safe-area-inset-bottom, 0px));
      overflow: auto;
      background: radial-gradient(100% 80% at 50% 100%, rgba(30, 38, 92, .9), rgba(5, 8, 22, .96))
    }

    .screen.on {
      display: flex;
      animation: fadeIn 1.6s ease both
    }

    .paper {
      width: min(560px, 100%);
      margin: auto
    }

    #letter .g {
      font-family: var(--hand);
      font-size: clamp(34px, 7vw, 44px);
      color: var(--accent);
      margin: 0 0 20px;
      opacity: 0;
      transition: opacity 1.4s
    }

    #letter p.l {
      text-wrap: pretty;
      font-size: clamp(21px, 4.6vw, 26px);
      line-height: 1.55;
      margin: 0 0 16px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.5s ease, transform 1.5s ease
    }

    #letter .g.on,
    #letter p.l.on {
      opacity: 1;
      transform: none
    }

    #letter .s {
      font-family: var(--hand);
      font-size: clamp(32px, 6.4vw, 40px);
      color: var(--accent);
      text-align: right;
      margin-top: 24px;
      opacity: 0;
      transition: opacity 1.4s
    }

    #letter .s.on {
      opacity: 1
    }

    #letter .smp {
      color: var(--mute);
      font-size: 15px;
      font-style: italic;
      text-align: right;
      opacity: 0;
      transition: opacity 1.4s
    }

    #letter .smp.on {
      opacity: 1
    }

    #letter .acts {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 26px;
      opacity: 0;
      transition: opacity 1.4s
    }

    #letter .acts.on {
      opacity: 1
    }

    .link {
      font-family: var(--hand);
      font-size: 28px;
      color: var(--accent);
      padding: 6px 2px;
      border-bottom: 1px solid rgba(255, 201, 168, .5)
    }

    #ask .paper {
      text-align: center
    }

    #ask h2 {
      font-style: italic;
      font-weight: 500;
      font-size: clamp(30px, 6.4vw, 46px);
      line-height: 1.25;
      margin: 0 0 30px;
      animation: fadeUp 1.4s ease both
    }

    #ask .opts {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      animation: fadeUp 1.4s ease .9s both
    }

    .opt {
      font-size: clamp(21px, 4.6vw, 25px);
      padding: 13px 26px;
      border-radius: 999px;
      border: 1px solid rgba(255, 201, 168, .55);
      color: var(--cream);
      transition: background .3s, transform .3s;
      width: min(380px, 100%)
    }

    .opt:hover {
      background: rgba(255, 201, 168, .14);
      transform: translateY(-2px)
    }

    #reply {
      font-style: italic;
      font-size: clamp(26px, 5.6vw, 36px);
      line-height: 1.35;
      margin: 0 0 14px;
      opacity: 0;
      transition: opacity 1.6s
    }

    #reply.on,
    #closing.on {
      opacity: 1
    }

    #closing {
      font-family: var(--hand);
      font-size: clamp(40px, 9vw, 60px);
      color: var(--accent);
      margin: 0 0 30px;
      opacity: 0;
      transition: opacity 2s ease 1.6s
    }

    #again {
      opacity: 0;
      transition: opacity 1.4s ease 4s
    }

    #again.on {
      opacity: 1
    }

    /* ===== sau lá thư: lý do + điều ước ===== */
    #rtext {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(98px + env(safe-area-inset-bottom, 0px));
      z-index: 9;
      text-align: center;
      padding: 0 28px;
      pointer-events: none
    }

    #rtext p {
      margin: 0 0 10px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1.6s ease, transform 1.6s ease, max-height 1.2s ease;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .85);
      max-height: 140px
    }

    #rtext p.on {
      opacity: 1;
      transform: none
    }

    #rtext .r1 {
      font-style: italic;
      font-size: clamp(26px, 5.6vw, 38px)
    }

    #rtext .r2 {
      font-size: clamp(19px, 4.2vw, 24px);
      color: #efe7da;
      text-wrap: balance
    }

    #rtext .r3 {
      font-family: var(--hand);
      font-size: clamp(22px, 4.6vw, 30px);
      color: var(--accent)
    }

    #rtext .r4 {
      font-family: var(--hand);
      font-size: clamp(22px, 4.6vw, 28px);
      color: var(--cream)
    }

    #rtext p.fold {
      opacity: 0;
      max-height: 0;
      margin: 0;
      overflow: hidden
    }

    #rnext {
      position: fixed;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: max-content;
      bottom: calc(34px + env(safe-area-inset-bottom, 0px));
      z-index: 12;
      white-space: nowrap;
      animation: fadeUp 1.4s ease both
    }

    #reason {
      position: fixed;
      z-index: 14;
      max-width: min(300px, 80vw);
      padding: 14px 18px;
      border-radius: 14px;
      text-align: center;
      pointer-events: none;
      background: rgba(8, 12, 34, .78);
      border: 1px solid rgba(255, 201, 168, .4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5), 0 0 40px rgba(255, 201, 168, .15);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .6s ease, transform .6s ease;
      visibility: hidden
    }

    #reason.on {
      opacity: 1;
      transform: none;
      visibility: visible
    }

    #reason .rl {
      display: block;
      font-family: var(--hand);
      font-size: 22px;
      color: var(--accent);
      line-height: 1.1;
      margin-bottom: 4px
    }

    #reason .rt {
      display: block;
      font-style: italic;
      font-size: 20px;
      line-height: 1.4;
      text-wrap: balance
    }

    #reason small {
      display: block;
      margin-top: 6px;
      color: var(--mute);
      font-size: 13px;
      font-style: italic
    }

    .screen.clear {
      background: radial-gradient(100% 80% at 50% 100%, rgba(20, 26, 70, .55), rgba(5, 8, 22, .62))
    }

    #wish .paper {
      text-align: center;
      transition: opacity .9s ease
    }

    #wish h2 {
      font-style: italic;
      font-weight: 500;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.25;
      margin: 0 0 24px;
      text-wrap: balance
    }

    #wish textarea {
      width: 100%;
      min-height: 120px;
      resize: none;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 201, 168, .5);
      background: rgba(6, 10, 30, .55);
      color: var(--cream);
      font: inherit;
      font-size: 22px;
      line-height: 1.5;
      text-align: center
    }

    #wish textarea::placeholder {
      color: #8f89a8;
      font-style: italic
    }

    #wish textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(255, 201, 168, .15)
    }

    #wish .row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 22px
    }

    #wish .done {
      font-style: italic;
      font-size: clamp(26px, 5.6vw, 36px);
      line-height: 1.35;
      margin: 0 0 12px
    }

    #wish .sub {
      color: var(--mute);
      font-size: 19px;
      margin: 0 0 26px
    }

    .wstar {
      position: fixed;
      left: 0;
      top: 0;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      background: #fff;
      z-index: 40;
      pointer-events: none;
      box-shadow: 0 0 20px 8px rgba(255, 226, 150, .85), 0 0 60px 20px rgba(255, 201, 168, .4);
      transition: transform 2.6s cubic-bezier(.22, .7, .28, 1), opacity .9s ease
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body>
  <canvas id="sky"></canvas>

  <div id="intro">
    <button id="firstStar" aria-label="Chạm vào ngôi sao"><span class="ring"></span><span class="ring r2"></span><span
        class="core"></span></button>
    <p id="introHint">Chạm vào ngôi sao nhé</p>
    <form id="gate" hidden autocomplete="off">
      <label id="gq" for="ga"></label>
      <div class="gin"><input id="ga" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
          aria-label="Câu trả lời"><button type="submit">Mở</button></div>
      <p id="gerr" role="alert"></p>
    </form>
  </div>

  <div id="line" aria-live="polite"></div>
  <div id="hint">Chạm vào ngôi sao đang sáng</div>
  <div id="dots" aria-hidden="true"></div>
  <button id="mute" aria-label="Bật hoặc tắt nhạc"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z" />
      <path id="wave1" d="M16.5 9a4 4 0 0 1 0 6" />
      <path id="wave2" d="M19 6.5a8 8 0 0 1 0 11" />
      <path id="slash" d="M4 4l16 16" style="display:none" />
    </svg></button>

  <div class="overlay" id="mem" role="dialog" aria-modal="true" aria-label="Kỷ niệm">
    <div class="mem">
      <figure class="frame" id="frame">
        <img id="mimg" alt="">
        <video id="mvid" playsinline controls loop preload="auto" style="display:none"></video>
      </figure>
      <div class="txt" id="mtxt">
        <span class="d" id="mdate"></span>
        <h2 id="mtitle"></h2>
        <p id="mbody"></p>
        <small id="msample"></small>
        <button class="nextb" id="mnext"></button>
      </div>
    </div>
  </div>

  <section class="screen" id="letter" aria-label="Lá thư">
    <div class="paper" id="paper"></div>
  </section>

              if (isCur && !reduce) { for (let k = 0; k < 2; k++) { const ph = ((now * .00055 + k * .5) % 1); g.globalAlpha = memA * (1 - ph) * .55; g.strokeStyle = 'rgba(255,214,178,1)'; g.lineWidth = 1; g.beginPath(); g.arc(x, y, 12 + ph * 34, 0, 7); g.stroke() } }
            } else { g.globalAlpha = memA * .65; g.fillStyle = '#ffe4cc'; g.beginPath(); g.arc(x, y, 2.6, 0, 7); g.fill() }
          }
          g.globalCompositeOperation = 'source-over';
        }
        // sao "lý do" đã tìm thấy
        if (FL.length || wishText) {
          g.globalCompositeOperation = 'lighter';
          for (let i = 0; i < FL.length; i += 2) {
            const x = FL[i], y = FL[i + 1], pu = 1 + .14 * Math.sin(now * .003 + i), sz = 40 * pu;
            g.globalAlpha = .9; g.drawImage(GLOW, x - sz / 2, y - sz / 2, sz, sz); g.globalAlpha = .85; g.fillStyle = '#fff6e8';

            g.beginPath(); g.moveTo(x, y - 8); g.lineTo(x + .9, y); g.lineTo(x, y + 8); g.lineTo(x - .9, y); g.closePath(); g.fill()

          if (wishText) {
            const x = W * .12, y = H * .1, pu = 1 + .12 * Math.sin(now * .0025), sz = 62 * pu;

      }
      function burst(x, y) { for (let i = 0; i < 22; i++) { const a = Math.random() * 6.28, v = .5 + Math.random() * 1.9; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1 }) } }
      function starAt(qx, qy) {

          const x = ((s.x * W - curOx * W * s.p) % W + W) % W, y = ((s.y * H - curOy * H * s.p) % H + H) % H, d = Math.hypot(x - qx, y - qy); if (d < bd) { bd = d; b = i }
        }

      }
      function loop(t) { requestAnimationFrame(loop); if (document.hidden) return; if (memA < 1 && memFade) memA = Math.min(1, memA + .012); draw(t) }
      let memFade = false;
      function hitStar(x, y) { let b = -1, bd = touchy() ? 46 : 34; const mx = 0, my = 0; for (let i = 0; i < MP.length && i <= cur; i++) { const d = Math.hypot(MP[i].x + mx - x, MP[i].y + my - y); if (d < bd) { bd = d; b = i } } return b }
      const touchy = () => matchMedia('(pointer: coarse)').matches;
      cv.addEventListener('pointermove', e => { if (state === 'sky') cv.classList.toggle('pick', hitStar(e.clientX, e.clientY) >= 0) });
      cv.addEventListener('pointerdown', () => hidePop());
      cv.addEventListener('pointerup', e => {
        if (state !== 'sky' && state !== 'reasons') return;

      });

      /* =============================== Luồng chính =============================== */
      let state = 'intro', retState = 'sky', reasonsOpen = false, found = 0, popTimer = null;
      const hint = $('#hint'), dots = $('#dots'), lineEl = $('#line');
      async function showLine(t, hold) { lineEl.textContent = t; lineEl.classList.add('on'); await sleep(hold); lineEl.classList.remove('on'); await sleep(1700) }
      function meetLine() {
        if (CONFIG.opening[0]) return CONFIG.opening[0];
        if (CONFIG.meetDate) { const d = new Date(CONFIG.meetDate + 'T00:00:00'); if (!isNaN(d)) return `Đêm ${d.getDate()} tháng ${d.getMonth() + 1} năm ${d.getFullYear()}, hai đứa mình gặp nhau.` }
        return 'Có một đêm, hai đứa mình gặp nhau.';
      }
      async function begin() {
        state = 'reveal'; $('#intro').classList.add('gone'); setTimeout(() => $('#intro').style.display = 'none', 1700);
        started = true; t0 = performance.now(); if (reduce) t0 -= 20000;
        await sleep(reduce ? 200 : 2600);
        await showLine(meetLine(), 3400);
        await showLine(CONFIG.opening[1], 3600);
        memFade = true; await sleep(reduce ? 200 : 2200);
        hint.classList.add('on'); dots.classList.add('on'); state = 'sky';
      }
      function renderDots() { dots.innerHTML = ''; mem.forEach((_, i) => { const d = document.createElement('i'); if (i < cur) d.className = 'on'; dots.appendChild(d) }) }
      function stopVideo() {
        const v = $('#mvid');
        if (v) {
          try { v.pause(); } catch (e) { }
          v.removeAttribute('src');
          v.load();
        }
      }
      let viewing = -1, lastFocus = null;
      function openMem(i, x, y) {
        viewing = i; retState = (state === 'reasons' ? 'reasons' : 'sky'); state = 'mem'; hidePop(); hint.classList.remove('on'); const m = mem[i]; lastFocus = document.activeElement;
        const img = $('#mimg'), vid = $('#mvid');
        const isVid = isVideoItem(m);
        const vidUrl = m.video || (isVid ? m.src : '');

        if (isVid && vidUrl) {
          img.style.display = 'none';
          img.removeAttribute('src');
          vid.style.display = 'block';
          vid.onerror = () => {
            vid.style.display = 'none';

          vid.src = resolveMedia(vidUrl);
          vid.currentTime = 0;
          vid.play().catch(() => { });
        } else {
          stopVideo();
          vid.style.display = 'none';
          img.style.display = 'block';
          img.onerror = () => {
            img.onerror = null;
            img.src = samplePic(i, mem.length);
          };
          img.src = resolveMedia(m.src) || samplePic(i, mem.length);
          img.alt = m.title;
        }

        const fr = $('#frame'); fr.style.setProperty('--ox', (x - W / 2) + 'px'); fr.style.setProperty('--oy', (y - H / 2) + 'px');
        $('#mdate').textContent = m.date; $('#mdate').hidden = !m.date; $('#mtitle').textContent = m.title; $('#mbody').textContent = m.text;
        const last = i === mem.length - 1 && i === cur;
        $('#mnext').textContent = i < cur ? 'Quay lại bầu trời' : (last ? 'Còn một điều nữa...' : 'Tiếp tục');
        const o = $('#mem'); o.classList.remove('open'); void o.offsetWidth; o.classList.add('open'); o.scrollTop = 0;
        $$anim();
      }
      function $$anim() { ['frame', 'mtxt'].forEach(id => { const e = document.getElementById(id); e.style.animation = 'none'; void e.offsetWidth; e.style.animation = '' }); document.querySelectorAll('#mtxt>*').forEach(e => { e.style.animation = 'none'; void e.offsetWidth; e.style.animation = '' }) }
      $('#mnext').addEventListener('click', async () => {

        }
        hint.classList.toggle('on', cur === 0 && !reasonsOpen);
        if (lastFocus && lastFocus.focus) try { lastFocus.focus() } catch (e) { }
      });
      addEventListener('keydown', e => { if (e.key === 'Escape' && state === 'mem') { stopVideo(); $('#mem').classList.remove('open'); state = retState } });

      /* =============================== Lá thư =============================== */
      async function startLetter() {
        state = 'letter'; hint.classList.remove('on'); dots.classList.remove('on');
        const p = $('#paper'); p.innerHTML = '';
        const L = CONFIG.letter, els = [];
        const gr = document.createElement('p'); gr.className = 'g'; gr.textContent = L.greeting; p.appendChild(gr); els.push(gr);
        L.paragraphs.forEach(t => { const e = document.createElement('p'); e.className = 'l'; e.textContent = t; p.appendChild(e); els.push(e) });
        const s = document.createElement('div'); s.className = 's'; s.textContent = L.signoff; p.appendChild(s); els.push(s);
        const ac = document.createElement('div'); ac.className = 'acts';
        const nb = document.createElement('button'); nb.className = 'link'; nb.textContent = 'Tiếp'; ac.appendChild(nb); nb.addEventListener('click', startReasons);

        p.appendChild(ac); els.push(ac);
        $('#letter').classList.add('on');
        await sleep(reduce ? 100 : 1600);
        for (let i = 0; i < els.length; i++) { els[i].classList.add('on'); const t = els[i].textContent || ''; await sleep(reduce ? 80 : Math.min(4200, 1200 + t.length * 26)) }
      }

      /* =============================== Lý do trong các vì sao =============================== */
      const SAMPLE_REASONS = ['Vì em cười là anh quên hết mệt.', 'Vì ở cạnh em, anh thấy mình tốt hơn.', 'Vì em kiên nhẫn với anh nhiều hơn anh xứng đáng.', 'Vì em làm ngày thường thành ngày đáng nhớ.', 'Vì em là người anh muốn kể chuyện đầu tiên.', 'Vì em dám mơ những điều lớn lao.', 'Vì em nhớ những điều nhỏ nhặt anh từng nói.', 'Vì em khiến anh muốn trở thành người tốt hơn mỗi ngày.', 'Vì có em, chuyện khó cũng thấy nhẹ đi.', 'Vì em là em, không cần thêm gì nữa.', 'Vì mỗi lần nhìn em, anh lại muốn nắm tay em chặt hơn.', 'Vì chỉ cần là em, thế là đủ.'];
      const REASONS = CONFIG.reasons.length ? CONFIG.reasons : SAMPLE_REASONS, reasonSample = !CONFIG.reasons.length;
      try { const w = JSON.parse(localStorage.getItem('sky-wish') || 'null'); if (w && w.t) wishText = w.t } catch (e) { }
      function daysTogether() {
        if (CONFIG.startDate) { const d = new Date(CONFIG.startDate + 'T00:00:00'); if (!isNaN(d)) return { n: Math.max(0, Math.floor((Date.now() - d.getTime()) / 864e5)), sample: false } }

      }

        const b = document.createElement('span'); b.className = 'rt'; b.textContent = text; p.appendChild(b);

      async function startReasons() {

        if (!gate) { begin(); return }

        $('#gq').textContent = gate.question; $('#gate').hidden = false; setTimeout(() => $('#ga').focus(), 400);
      });

      $('#gate').addEventListener('submit', e => {
        e.preventDefault();
        if (gate.answers.includes(cyrb53(norm($('#ga').value)))) { $('#gate').hidden = true; $('#ga').blur(); begin() }
        else {
          fails++; const f = $('#gate'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
          $('#gerr').textContent = fails >= 3 && gate.hint ? gate.hint : 'Chưa đúng rồi, thử lại nhé'; $('#ga').select()
        }
      });
    })();
